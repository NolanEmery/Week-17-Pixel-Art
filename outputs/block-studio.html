<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Block Studio</title>
  <style>
    :root{--bg:#a8aaae;--panel:#15171b;--panel2:#202329;--line:#343840;--text:#f4f5f7;--muted:#a1a7b1;--cyan:#73e6dc;--accent:#ffcf62;--grid:rgba(255,255,255,.52)}
    *{box-sizing:border-box} body{margin:0;font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden} button,input{font:inherit} button{border:0;color:inherit;cursor:pointer}
    .app{height:100vh;display:grid;grid-template-columns:266px 1fr 300px;grid-template-rows:62px 1fr}
    .topbar{grid-column:1/-1;background:#101216;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #272b31;gap:18px;z-index:5}.brand{font-size:19px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}.brand-mark{width:27px;height:27px;background:var(--cyan);border-radius:7px;transform:rotate(45deg);position:relative}.brand-mark:after{content:"";position:absolute;inset:7px;background:#101216;border-radius:2px}.project{color:var(--muted);border-left:1px solid #30343b;padding-left:18px}.top-actions{display:flex;gap:9px;margin-left:auto}.btn{background:#272b31;padding:9px 12px;border-radius:8px;font-weight:650;font-size:13px;transition:.15s}.btn:hover{background:#383d45}.btn.primary{background:var(--cyan);color:#102120}.btn.ghost{background:transparent;border:1px solid #3b4049}
    aside{background:var(--panel);border-right:1px solid #292d33;overflow:auto}.layers{padding:18px 14px}.section-head{display:flex;justify-content:space-between;align-items:center;color:#bdc2cb;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;margin:3px 4px 14px}.icon-btn{width:25px;height:25px;border-radius:6px;background:#292d33;font-size:17px;line-height:1}.layer{display:flex;align-items:center;gap:9px;padding:10px;border-radius:8px;margin:3px 0;color:#abb1ba}.layer.active{background:#292e35;color:#fff}.eye{opacity:.65;font-size:15px}.layer-cube{width:17px;height:17px;border-radius:4px;background:#65cdc6;box-shadow:4px 4px 0 #3e8e8a}.layer:nth-of-type(3) .layer-cube{background:#8d96a5;box-shadow:4px 4px 0 #5e6673}.layer-name{flex:1}.objects{border-top:1px solid #292d33;padding:18px 14px}.object{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px}.object:hover{background:#24272d}.object-dot{width:13px;height:13px;border-radius:4px;background:var(--object-color,#ffcf62);box-shadow:3px 3px 0 color-mix(in srgb,var(--object-color,#ffcf62) 55%,#000)}.object small{margin-left:auto;color:#727985}
    main{position:relative;min-width:0;overflow:hidden;background:var(--bg)}.hint{position:absolute;top:18px;left:22px;color:#fff;font-weight:700;font-size:13px;background:rgba(23,25,29,.78);padding:9px 12px;border-radius:8px;z-index:3}.hint kbd{background:#424750;border-radius:4px;padding:2px 5px;margin-left:5px;font-size:11px}.mode-badge{position:absolute;top:18px;right:20px;z-index:3;background:rgba(18,20,24,.8);border:1px solid #41464e;border-radius:9px;padding:8px 11px;color:#cdd1d6;font-size:12px}.canvas{height:100%;position:relative;cursor:crosshair;user-select:none;touch-action:none}.grid{position:absolute;width:900px;height:900px;left:50%;top:52%;transform:translate(-50%,-50%) rotateX(60deg) rotateZ(45deg);transform-style:preserve-3d;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:50px 50px;background-color:rgba(255,255,255,.08);box-shadow:0 0 100px rgba(255,255,255,.1);transition:transform .35s ease}.grid:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.7)}.blocks{position:absolute;inset:0;pointer-events:none}.block{position:absolute;width:50px;height:50px;transform-style:preserve-3d;filter:drop-shadow(10px 14px 7px rgba(0,0,0,.22));pointer-events:auto;cursor:pointer}.block .top,.block .left,.block .right{position:absolute;inset:0;background:var(--c);border:1px solid rgba(255,255,255,.28)}.block .top{transform:translateZ(25px)}.block .left{transform:rotateY(90deg) translateZ(25px);filter:brightness(.72)}.block .right{transform:rotateX(90deg) translateZ(25px);filter:brightness(.87)}.block.selected .top,.block.selected .left,.block.selected .right{outline:3px solid white;outline-offset:-3px}.crosshair{position:absolute;width:20px;height:20px;border:2px solid rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .1s}.canvas:hover .crosshair{opacity:1}
    .inspector{background:var(--panel);border-left:1px solid #292d33;overflow:auto;padding:18px 16px}.tabs{display:flex;border-bottom:1px solid #333740;margin:-18px -16px 20px;padding:0 16px}.tab{padding:16px 4px 12px;margin-right:18px;color:#818792;background:none;font-weight:750}.tab.active{color:#fff;border-bottom:2px solid var(--cyan)}.property{margin:18px 0}.label{font-size:11px;color:#9da3ad;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}.color-row{display:flex;gap:8px}.swatch{width:29px;height:29px;border-radius:7px;background:var(--swatch);border:2px solid transparent}.swatch.active{border-color:#fff;box-shadow:0 0 0 2px #555}.color-input{width:31px;height:31px;padding:0;border:0;background:transparent}.field{background:#24272d;border:1px solid #383d45;border-radius:7px;width:100%;color:#eee;padding:10px}.row{display:flex;gap:8px}.row>*{flex:1}.segmented{display:flex;background:#22252b;border-radius:8px;padding:3px}.seg{flex:1;background:transparent;color:#9da3ad;padding:8px 5px;border-radius:6px;font-size:12px;font-weight:700}.seg.active{background:#444a54;color:#fff}.camera{border-top:1px solid #2c3037;margin-top:22px;padding-top:18px}.slider{width:100%;accent-color:var(--cyan)}.group-actions{display:flex;gap:8px}.group-actions .btn{flex:1;font-size:12px;padding:9px 5px}.empty-state{color:#9299a4;font-size:13px;padding:10px 0}.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#17191d;color:#fff;border:1px solid #4b515b;border-radius:8px;padding:11px 15px;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.app{grid-template-columns:210px 1fr;grid-template-rows:56px 1fr}.inspector{display:none}.topbar{padding:0 12px}.project{display:none}.layers{padding:14px 9px}.hint{font-size:11px}.grid{transform:translate(-50%,-50%) rotateX(60deg) rotateZ(45deg) scale(.78)}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brand-mark"></span>Block Studio</div><div class="project">Untitled build <span id="saveState">• Saved locally</span></div><div class="top-actions"><button class="btn" id="newBtn">New</button><button class="btn" id="saveBtn">Save</button><button class="btn primary" id="shareBtn">↗ Share</button></div></header>
  <aside><div class="layers"><div class="section-head">Layers <button class="icon-btn" id="addLayer">+</button></div><div id="layerList"><div class="layer active"><span class="eye">◉</span><span class="layer-cube"></span><span class="layer-name">Structure</span><small>3</small></div><div class="layer"><span class="eye">◉</span><span class="layer-cube"></span><span class="layer-name">Ground</span><small>0</small></div></div></div><div class="objects"><div class="section-head">Placed blocks <span id="objectCount">0</span></div><div id="objectList" class="empty-state">Your build is empty.</div></div></aside>
  <main><div class="hint">Click the grid to place <kbd>G</kbd> group selection</div><div class="mode-badge" id="modeBadge">Orbit camera</div><div class="canvas" id="canvas"><div class="grid" id="grid"></div><div class="blocks" id="blocks"></div><div class="crosshair" id="crosshair"></div></div><div class="toast" id="toast"></div></main>
  <section class="inspector"><div class="tabs"><button class="tab active">Block</button><button class="tab">Scene</button></div><div class="property"><div class="label">Block color</div><div class="color-row" id="palette"><button class="swatch active" style="--swatch:#ffcf62" data-color="#ffcf62"></button><button class="swatch" style="--swatch:#ef7766" data-color="#ef7766"></button><button class="swatch" style="--swatch:#8c9eff" data-color="#8c9eff"></button><button class="swatch" style="--swatch:#72e0d2" data-color="#72e0d2"></button><button class="swatch" style="--swatch:#c786eb" data-color="#c786eb"></button><input class="color-input" id="colorPicker" type="color" value="#ffcf62" title="Custom color"></div></div><div class="property"><div class="label">Block label</div><input class="field" id="blockLabel" value="Block" maxlength="20"></div><div class="property"><div class="label">Placement layer</div><select class="field" id="layerSelect"><option>Structure</option><option>Ground</option></select></div><div class="property"><div class="label">Selected blocks</div><div class="group-actions"><button class="btn" id="selectAll">Select all</button><button class="btn" id="groupBtn">Group</button><button class="btn" id="ungroupBtn">Ungroup</button></div><div class="empty-state" id="selectionInfo">No blocks selected</div></div><div class="camera"><div class="label">Camera</div><div class="segmented"><button class="seg active" data-mode="orbit">Orbit</button><button class="seg" data-mode="free">Free-cam</button></div><div class="property"><div class="label">View rotation</div><input class="slider" id="rotation" type="range" min="-50" max="50" value="0"></div><div class="property"><div class="label">Zoom</div><input class="slider" id="zoom" type="range" min="65" max="125" value="100"></div></div></section>
</div>
<script>
(() => {
 const state={blocks:[], color:'#ffcf62', label:'Block', layer:'Structure', selected:[], groupCounter:0, rotation:0, zoom:100, mode:'orbit',panX:0,panY:0};
 const $=s=>document.querySelector(s), blocksEl=$('#blocks'), grid=$('#grid'), objectList=$('#objectList'), toast=$('#toast');
 const showToast=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2100)};
 const save=()=>{localStorage.setItem('block-studio-v1',JSON.stringify(state));$('#saveState').textContent='• Saved locally';showToast('Build saved to this device')};
 const render=()=>{blocksEl.innerHTML='';state.blocks.forEach(b=>{const e=document.createElement('div');e.className='block'+(state.selected.includes(b.id)?' selected':'');e.style.cssText=`--c:${b.color};left:${b.x}px;top:${b.y}px;transform:translateZ(${b.z*50}px)`;e.title=`${b.label} · level ${b.z+1}`;e.innerHTML='<i class="top"></i><i class="left"></i><i class="right"></i>';e.onclick=ev=>{ev.stopPropagation(); if(ev.shiftKey){toggle(b.id)}else{state.selected=[b.id];render()}};blocksEl.appendChild(e)});
  $('#objectCount').textContent=state.blocks.length; objectList.innerHTML=state.blocks.length?state.blocks.map(b=>`<div class="object" style="--object-color:${b.color}" data-id="${b.id}"><span class="object-dot"></span><span>${b.label}</span><small>L${b.z+1}</small></div>`).join(''):'Your build is empty.'; [...objectList.querySelectorAll('.object')].forEach(o=>o.onclick=()=>{state.selected=[+o.dataset.id];render()});
  $('#selectionInfo').textContent=state.selected.length?`${state.selected.length} selected${state.selected.length>1?' — edit color to update group':''}`:'No blocks selected'; applyView(); };
 const applyView=()=>{grid.style.transform=`translate(calc(-50% + ${state.panX}px),calc(-50% + ${state.panY}px)) rotateX(60deg) rotateZ(${45+state.rotation}deg) scale(${state.zoom/100})`; $('#modeBadge').textContent=state.mode==='orbit'?'Orbit camera':'Free camera'};
 const toggle=id=>{state.selected.includes(id)?state.selected=state.selected.filter(x=>x!==id):state.selected.push(id);render()};
 const place=e=>{const rect=grid.getBoundingClientRect(), size=50;let x=Math.floor((e.clientX-rect.left)/size)*size, y=Math.floor((e.clientY-rect.top)/size)*size;x=Math.max(0,Math.min(850,x));y=Math.max(0,Math.min(850,y));const below=state.blocks.filter(b=>b.x===x&&b.y===y);const z=below.length?Math.max(...below.map(b=>b.z))+1:0;const b={id:Date.now(),x,y,z,color:state.color,label:state.label||'Block',layer:state.layer,group:null};state.blocks.push(b);state.selected=[b.id];render();$('#saveState').textContent='• Unsaved changes';showToast(z?'Placed on level '+(z+1):'Block placed')};
 let drag=null, dragged=false; $('#canvas').addEventListener('pointerdown',e=>{if(e.target.closest('.block'))return;drag={x:e.clientX,y:e.clientY,rotation:state.rotation,panX:state.panX,panY:state.panY};dragged=false;$('#canvas').setPointerCapture(e.pointerId)}); $('#canvas').addEventListener('pointermove',e=>{ $('#crosshair').style.left=e.clientX+'px';$('#crosshair').style.top=e.clientY+'px';if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)dragged=true;if(dragged){if(state.mode==='orbit'){state.rotation=Math.max(-50,Math.min(50,drag.rotation+dx*.18));$('#rotation').value=state.rotation}else{state.panX=drag.panX+dx;state.panY=drag.panY+dy}applyView()}}); $('#canvas').addEventListener('pointerup',e=>{if(!drag)return;const shouldPlace=!dragged;drag=null;if(shouldPlace&&!e.target.closest('.block'))place(e)});
 $('#palette').addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b)return;setColor(b.dataset.color);}); function setColor(c){state.color=c;$('#colorPicker').value=c;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.color===c));if(state.selected.length){state.blocks.filter(b=>state.selected.includes(b.id)).forEach(b=>b.color=c);showToast('Updated selected block'+(state.selected.length>1?'s':'')+' color')}render()}
 $('#colorPicker').oninput=e=>setColor(e.target.value); $('#blockLabel').oninput=e=>{state.label=e.target.value;if(state.selected.length){state.blocks.filter(b=>state.selected.includes(b.id)).forEach(b=>b.label=state.label);render()}}; $('#layerSelect').onchange=e=>state.layer=e.target.value;
 document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===b));showToast(state.mode==='orbit'?'Orbit camera enabled':'Free camera enabled');applyView()});
 $('#rotation').oninput=e=>{state.rotation=+e.target.value;applyView()};$('#zoom').oninput=e=>{state.zoom=+e.target.value;applyView()}; $('#selectAll').onclick=()=>{state.selected=state.blocks.map(b=>b.id);render()}; $('#groupBtn').onclick=()=>{if(state.selected.length<2)return showToast('Select at least two blocks to group');const g='Group '+(++state.groupCounter);state.blocks.filter(b=>state.selected.includes(b.id)).forEach(b=>b.group=g);showToast(g+' created — changes apply together');render()};$('#ungroupBtn').onclick=()=>{state.blocks.filter(b=>state.selected.includes(b.id)).forEach(b=>b.group=null);showToast('Selection ungrouped');render()};
 $('#saveBtn').onclick=save; $('#shareBtn').onclick=async()=>{save();const url=location.href.split('#')[0]+'#build='+btoa(unescape(encodeURIComponent(JSON.stringify(state))));try{await navigator.clipboard.writeText(url);showToast('Share link copied') }catch{prompt('Copy this share link:',url)}}; $('#newBtn').onclick=()=>{if(!state.blocks.length||confirm('Start a new empty build?')){state.blocks=[];state.selected=[];render();showToast('New build ready')}};
 $('#addLayer').onclick=()=>{const n='Layer '+($('#layerList').children.length+1);const d=document.createElement('div');d.className='layer';d.innerHTML=`<span class="eye">◉</span><span class="layer-cube"></span><span class="layer-name">${n}</span><small>0</small>`;$('#layerList').appendChild(d);const o=document.createElement('option');o.textContent=n;$('#layerSelect').appendChild(o);showToast(n+' added')};
 document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='g'){if(state.selected.length>1)$('#groupBtn').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
 try{const shared=location.hash.match(/build=(.*)/);const saved=shared?JSON.parse(decodeURIComponent(escape(atob(shared[1])))):JSON.parse(localStorage.getItem('block-studio-v1'));if(saved&&saved.blocks){Object.assign(state,saved);$('#colorPicker').value=state.color;$('#blockLabel').value=state.label;$('#rotation').value=state.rotation;$('#zoom').value=state.zoom}}catch{} render();
})();
</script>
</body></html>
